packages:
  # all packages in direct subdirs of packages/
  - '.'
  # all packages in subdirs of components/
  - 'examples/**'
  - 'docs'

allowBuilds:
  esbuild: false
  lefthook: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@sanity/*'
  - 'groq-js'
  - 'react-multiplayer-input'
  # Renovate security update: nanoid@5.1.16
  - nanoid@5.1.16
